# nginx cho TDC QR Events: phuc vu giao dien (apps/web/dist) va chuyen /api sang backend.
# Dat file nay vao /etc/nginx/conf.d/ ; thay tdc-qr.example.edu.vn bang ten mien that; chung chi dat o duong dan ben duoi.
# Kiem tra: nginx -t   (xem docs/trien-khai.md)

upstream tdc_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Gioi han tho theo IP, chi chong DDoS; gioi han chinh nam o API (theo thiet bi / MSSV).
# Sinh vien diem danh bang 4G/5G: nha mang dung CGNAT nen nhieu may cung mang, cung tram co the chung mot IPv4.
# Vi vay trang diem danh cong khai (/api/public/) co vung rieng, rong hon (~ PUBLIC_IP_RATE_LIMIT_PER_MIN=20000/phut cua API).
limit_req_zone $binary_remote_addr zone=tdc_api_zone:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=tdc_public_zone:10m rate=300r/s;
# vuot gioi han tra 429 (giao dien hien "thao tac qua nhanh") thay vi 503 mac dinh
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name tdc-qr.example.edu.vn;
    return 301 https://$host$request_uri;
}

server {
    # cu phap http2 nay chay duoc tren ca nginx cu va moi (ban >= 1.25.1 chi bao 'deprecated')
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tdc-qr.example.edu.vn;

    ssl_certificate     /etc/ssl/tdc-qr/fullchain.pem;
    ssl_certificate_key /etc/ssl/tdc-qr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:tdc_ssl:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # [BM] header bao mat. Dat o muc server (khong dung add_header trong location, vi se lam mat cac header nay).
    # img-src cho phep nen ban do CARTO/OSM (chi man chon toa do cua quan tri dung Leaflet); GPS can https + geolocation=(self).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    root /var/www/tdc-qr;
    index index.html;

    # Trang diem danh cong khai: ca hoi truong quet QR cung luc
    location /api/public/ {
        limit_req zone=tdc_public_zone burst=1000 nodelay;
        proxy_pass http://tdc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API: giu nguyen Host (API kiem tra Origin cung host), chuyen IP that cho API (TRUST_PROXY=true)
    location /api/ {
        limit_req zone=tdc_api_zone burst=200 nodelay;
        proxy_pass http://tdc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;  # giu nguyen Host (ke ca cong) vi API doi chieu voi Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi de, khong noi them: khong tin header do client gui
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # tep co ma bam trong ten: cache dai; index.html khong cache de ban moi co hieu luc ngay
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA: moi duong dan khac tra index.html (vd. /diem-danh/<ma>, /hoat-dong/<id>)
    location / {
        try_files $uri /index.html;
    }

    # an tep an
    location ~ /\.(?!well-known) {
        deny all;
    }
}
